name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup env vars for type checking
        run: |
          echo "ZEPTO_TOKEN=test-token" > .env
          echo "EMAIL_FROM_ADDRESS=test@example.com" >> .env
          echo "EMAIL_TO_ADDRESS=test@example.com" >> .env

      - name: Sync SvelteKit (generates env types)
        run: bun run prepare

      - name: Run type check
        run: bun run check

      - name: Run linter
        run: bun run lint

      - name: Run tests
        run: bun run test

      # A developer machine rarely carries someone else's credentials, which is how a
      # release shipped inference that read an unrelated AWS key as "send the SMS via
      # SNS" — and then missed Twilio's pair the same way, because the fix was a
      # hand-written list of names someone had thought of. This run fills the environment
      # from the registry itself, so every credential postboi knows about is present,
      # including whatever gets added next.
      - name: Run tests on a machine carrying other people's credentials
        run: bun run test
        env:
          POSTBOI_TEST_POLLUTE: "1"

      - name: Build
        run: bun run build

  # WET on purpose (each example is copy-paste-complete for its framework), which is
  # only affordable if nothing rots silently — so every example installs and runs its
  # own `ci` script (a typecheck or build, whichever is cheapest and meaningful).
  #
  # Against the version each example pins, an example could never use anything the next
  # release adds: pre-1.0 a caret can't cross a minor, so `^0.35.0` never installs
  # 0.36.0 and the job went red for a feature that was fine. They install the tarball
  # from this commit instead. The pins stay real — someone copying an example folder
  # still gets a working install — they just aren't what CI resolves.
  examples:
    name: Examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup env vars for the package build
        run: |
          echo "ZEPTO_TOKEN=test-token" > .env
          echo "EMAIL_FROM_ADDRESS=test@example.com" >> .env
          echo "EMAIL_TO_ADDRESS=test@example.com" >> .env

      # `npm pack` is the published artifact, not a shortcut to it: it runs `prepack`
      # (svelte-package, the CLI build, publint) and honours `files` and `exports`
      # exactly as `npm publish` would. So the thing the old job was really testing — a
      # path missing from `files`, a broken exports entry, a `.d.ts` that doesn't
      # resolve in someone else's project — still fails here. A symlink (`bun link`)
      # would have tested none of that, and would resolve peers from this repo's
      # node_modules rather than the example's.
      - name: Pack the package the examples install
        run: npm pack --pack-destination "$RUNNER_TEMP"

      # Unpacked over the installed copy rather than `bun add`ed. Two examples commit
      # a bun.lock pinning postboi@^0.35.0, and a second resolution for the same name
      # under a lockfile is a conflict bun refuses outright (DependencyLoop). Extracting
      # sidesteps resolution entirely, and is complete rather than a hack because
      # postboi has no runtime `dependencies` — the directory *is* the install, and the
      # .bin/postboi symlink the install made still points into it.
      - name: Check every example
        run: |
          set -e
          tarball="$(ls "$RUNNER_TEMP"/postboi-*.tgz)"
          for dir in examples/*/; do
            echo "── $dir"
            (
              cd "$dir"
              bun install
              rm -rf node_modules/postboi
              mkdir -p node_modules/postboi
              tar -xzf "$tarball" -C node_modules/postboi --strip-components=1
              bun run ci
            )
          done
