name: Postboi workload smoke
on:
  push:
    branches: [workload-smoke, workload-smoke-untrusted]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      POSTBOI_WORKLOAD_ID: wl_nxi4oct146jc
      SMOKE_MAILBOX: ""
      SMOKE_EXPECT: ${{ github.ref_name == 'workload-smoke' && 'ok' || 'refused' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/workload_claims.ts
      - run: bun scripts/workload_smoke.ts
