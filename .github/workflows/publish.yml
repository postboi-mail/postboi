name: Publish

on:
  push:
    tags: ["v*"]
  # Two callers share this path: release.yml dispatches it after pushing the
  # version bump (a dispatch is the only route that gives this file a top-level
  # run of its own — npm's trusted publisher names this filename and validates
  # the run's top-level workflow, so neither a reusable-workflow call nor a
  # GITHUB_TOKEN tag push can reach it), and a human runs it by hand from an
  # environment that can't push tags. Either way it derives the tag from
  # package.json and creates the tag and release if they don't exist yet.
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted publishing needs npm >= 11.5.1 — Node 24 bundles 11.16+, so no npm
      # upgrade step (in-place `npm install -g npm@latest` corrupts its own install
      # across major bumps, e.g. 11 → 12 lost sigstore and broke provenance).
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi
          if [ "$tag" != "v$version" ]; then
            echo "✗ tag $tag does not match package.json version $version" >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup env vars for type checking
        run: |
          echo "ZEPTO_TOKEN=test-token" > .env
          echo "EMAIL_FROM_ADDRESS=test@example.com" >> .env
          echo "EMAIL_TO_ADDRESS=test@example.com" >> .env

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      # No token — auth is OIDC via the trusted publisher configured on npmjs.com,
      # which also attaches provenance to the package. An already-published
      # version is skipped ONLY if npm's copy came from this exact commit — that
      # keeps a re-run a re-run without letting a moved tag paint a stale
      # publish green.
      - name: Publish to npm
        run: |
          if published_head="$(npm view "postboi@$VERSION" gitHead 2>/dev/null)"; then
            head="$(git rev-parse HEAD)"
            if [ "$published_head" = "$head" ]; then
              echo "• postboi@$VERSION is already on npm, from this exact commit — nothing to publish"
            else
              echo "✗ postboi@$VERSION is already on npm, published from ${published_head:-an unknown commit} — not $head." >&2
              echo "  npm will keep serving those bits; releasing this commit needs a new version." >&2
              exit 1
            fi
          else
            npm publish
          fi

      # On dispatch runs the tag may not exist yet — gh creates it at this
      # commit (tags created with the workflow's own token don't re-trigger
      # this workflow, which is why release.yml dispatches instead of tagging).
      # When prepare already pushed the tag, --target is ignored and the
      # release attaches to it.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "• release $TAG already exists"
            exit 0
          fi
          args=(--title "${TAG#v}" --generate-notes)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "${args[@]}"

      # tempboi is `postboi inbox` under a short name, released in step with postboi:
      # the same version, depending on exactly this postboi. Its own trusted
      # publisher on npmjs.com names this same workflow file. Last, so a problem
      # with tempboi's npm setup can't hold up postboi's GitHub release.
      - name: Publish tempboi to npm
        working-directory: packages/tempboi
        run: |
          if [ "$(npm view "tempboi@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "• tempboi@$VERSION is already on npm — nothing to publish"
            exit 0
          fi
          node -e '
            const fs = require("node:fs")
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
            pkg.version = process.env.VERSION
            pkg.dependencies.postboi = process.env.VERSION
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, "\t") + "\n")
          '
          npm publish
